name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run tests
        # NEEDS THE SPLIT TO FIX IMPORTS: the code uses relative imports and the
        # tests do `from orchestrator import ...`, and tools.py resolves sibling
        # programs relative to the monorepo. As a repo root this command will fail
        # until the split petition fixes the imports/paths.
        run: |
          python -m unittest discover -s tests
