name: test

# Generic template. Copy to <repo>/.github/workflows/test.yml and replace
# TEST_COMMAND with the command that runs the program's tests from the repo root.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run tests
        run: |
          # TEST_COMMAND
          python -m unittest discover -s tests
