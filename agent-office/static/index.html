<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1430">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Guild Hall">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/static/style.css">
<title>Agent Office</title>
</head>
<body>
<header id="top">
  <div class="crest" aria-hidden="true"></div>
  <div class="titles">
    <h1>The Guild Hall</h1>
    <p id="greeting">Lighting the torches…</p>
  </div>
  <button type="button" id="vault-chip" class="chip" hidden></button>
  <button type="button" class="icon-btn top-btn" data-open="settings" aria-label="Ravens and seals">🪶</button>
</header>
<div id="tally" class="tally" aria-live="polite"></div>
<div id="gold-banner" class="gold-banner" hidden></div>
<section id="raid" class="raid" hidden></section>
<nav class="toolbar" aria-label="Panels">
  <button type="button" data-open="chain" id="chain-btn">⚜️ Chain <span class="badge" hidden></span></button>
  <button type="button" data-open="petitions" id="petitions-btn">📜 Petitions <span class="badge" hidden></span></button>
  <button type="button" data-open="usage">⛁ Treasury</button>
  <button type="button" data-open="bots">🐾 Familiars</button>
  <button type="button" data-open="disk">🏛 Vault</button>
  <button type="button" data-open="search">🔮 Scry</button>
  <button type="button" data-open="ledger">📖 Ledger</button>
</nav>

<main id="views">
  <section id="view-hall" class="view" aria-label="Guild hall">
    <section id="town" class="town" aria-label="Guild town">
      <div class="town-bar">
        <button type="button" id="town-back" class="town-btn" hidden>← Town</button>
        <h2 id="town-title">Guild Town</h2>
        <span id="town-sub" class="town-sub"></span>
      </div>
      <div class="stage-wrap">
        <div id="town-stage" class="stage">
          <canvas id="town-canvas"></canvas>
          <canvas id="town-blur" class="tilt"></canvas>
          <canvas id="town-glow" class="glow"></canvas>
          <div class="grade" aria-hidden="true"></div>
          <div id="town-hits" class="hits"></div>
        </div>
      </div>
      <div id="town-roster" class="roster" hidden></div>
      <section id="chatlog" class="chatlog" aria-label="Guild chat">
        <div class="chat-tabs" role="tablist">
          <button type="button" class="on" data-ch="all">All</button><button type="button" data-ch="guild">Guild</button><button type="button" data-ch="system">System</button><button type="button" data-ch="say">Chatter</button><button type="button" data-ch="external">External</button>
        </div>
        <div id="chat-lines" class="chat-lines" role="log" aria-live="off"></div>
      </section>
    </section>
    <div id="notice-board" class="notice-board" hidden>
      <h2>Notice board</h2>
      <div id="notices"></div>
    </div>
    <details id="returned" class="shelf" hidden>
      <summary>Returned from their quests <span class="count"></span></summary>
      <div class="shelf-list"></div>
    </details>
    <details id="archives" class="shelf" hidden>
      <summary>The archives <span class="count"></span></summary>
      <div class="shelf-list"></div>
    </details>
  </section>
</main>

<button type="button" id="post-quest" class="fab" data-open="job">＋ Post a quest</button>

<div id="backdrop" class="backdrop" hidden></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-name" hidden>
  <div class="grip" aria-hidden="true"></div>
  <header class="sheet-head">
    <div id="sheet-portrait" class="portrait"></div>
    <div class="sheet-titles">
      <h2 id="sheet-name"></h2>
      <p id="sheet-meta" class="meta"></p>
    </div>
    <button type="button" id="sheet-close" class="icon-btn" aria-label="Close">✕</button>
  </header>
  <div id="sheet-actions" class="sheet-actions"></div>
  <div id="sheet-body" class="sheet-body"></div>
  <footer id="sheet-foot" class="sheet-foot"></footer>
</section>
<div id="toast" class="toast" role="status" hidden></div>

<script src="/static/md.js" defer></script>
<script src="/static/sprites.js" defer></script>
<script src="/static/app.js" defer></script>
<script src="/static/team.js" defer></script>
<script src="/static/panels.js" defer></script>
<script src="/static/petitions.js" defer></script>
<script src="/static/chain.js" defer></script>
<script src="/static/profile.js" defer></script>
<script src="/static/rpg.js" defer></script>
<script src="/static/economy.js" defer></script>
<script src="/static/chatlog.js" defer></script>
<script src="/static/town.js" defer></script>
</body>
</html>
