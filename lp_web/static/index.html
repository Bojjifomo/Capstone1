<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E1517">
<title>LP Web</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E1517'/%3E%3Cpath d='M16 6l9 10-9 10-9-10z' fill='%236FD3C1'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="lp-home">
  <div class="lp-brand"><span class="lp-brand-mark">◆ LP WEB</span><span class="lp-tag">Robinhood Chain</span></div>
  <h1>Your LP scripts, in the browser</h1>
  <p>Same tables and buttons as the Scriptable widgets on your phone. Pick one to open.</p>
  <div class="lp-grid" id="list"><div class="lp-card lp-loading"><div class="lp-spinner"></div>Looking for scripts…</div></div>
  <div class="lp-note" id="note"></div>
</div>
<script>
window.LP_TOKEN = "__LP_TOKEN__";
(async () => {
  const list = document.getElementById("list"), note = document.getElementById("note");
  const META = {
    "RH Portfolio": ["📊", "Your positions: PnL, fees, close, claim, re-enter"],
    "RH Pool": ["⚡", "USDG pools ranked by fee yield, with one-tap zap"],
    "RH Wallet": ["👛", "Wallet view"],
  };
  const order = ["RH Portfolio", "RH Pool", "RH Wallet"];
  try {
    const r = await fetch("/api/scripts", { headers: { "X-LP-Token": window.LP_TOKEN } });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    const names = j.scripts.slice().sort((a, b) => {
      const ia = order.indexOf(a), ib = order.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
    });
    list.innerHTML = "";
    if (!names.length) list.innerHTML = '<div class="lp-card lp-loading">No scripts found.</div>';
    for (const n of names) {
      const a = document.createElement("a");
      a.href = "/run/" + encodeURIComponent(n);
      const m = META[n] || ["📄", ""];
      const i = document.createElement("i"); i.textContent = m[0];
      const b = document.createElement("b"); b.textContent = n;
      const s = document.createElement("span"); s.textContent = m[1];
      a.append(i, b, s);
      list.appendChild(a);
    }
    note.textContent = "Reading scripts from " + j.dir
      + (j.hasSecrets ? "" : ". No RH Secrets there, so the scripts run without keys (view only).");
  } catch (e) {
    list.innerHTML = "";
    const d = document.createElement("div");
    d.className = "lp-error"; d.textContent = "Could not reach the local server: " + e.message;
    list.appendChild(d);
  }
})();
</script>
</body>
</html>
